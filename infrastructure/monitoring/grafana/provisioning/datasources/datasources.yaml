apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 5000
      derivedFields:
        # OTel JSON logs: "TraceId":"<32-hex-chars>"
        - datasourceUid: tempo
          matcherRegex: '"TraceId"\s*:\s*"([0-9a-fA-F]{32})"'
          name: TraceID
          url: "$${__value.raw}"
        # Serilog OTel text logs: traceId=<32-hex-chars>
        - datasourceUid: tempo
          matcherRegex: "traceId=([0-9a-fA-F]{32})"
          name: TraceID
          url: "$${__value.raw}"

  - name: Tempo
    type: tempo
    access: proxy
    uid: tempo
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
