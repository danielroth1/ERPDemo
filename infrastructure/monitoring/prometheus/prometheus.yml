# Local development Prometheus config
# Services run on the host machine; use host.docker.internal to reach them from the container.
# Service ports: gateway=8080, user-management=5001, inventory=5002, sales=5003, financial=5004, dashboard=5005

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'erp-local'
    environment: 'development'

scrape_configs:
  # API Gateway
  - job_name: 'gateway'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'gateway'
    metrics_path: '/metrics'

  # User Management Service
  - job_name: 'user-management'
    static_configs:
      - targets: ['host.docker.internal:5001']
        labels:
          service: 'user-management'
    metrics_path: '/metrics'

  # Inventory Service
  - job_name: 'inventory'
    static_configs:
      - targets: ['host.docker.internal:5002']
        labels:
          service: 'inventory'
    metrics_path: '/metrics'

  # Sales Service
  - job_name: 'sales'
    static_configs:
      - targets: ['host.docker.internal:5003']
        labels:
          service: 'sales'
    metrics_path: '/metrics'

  # Financial Service
  - job_name: 'financial'
    static_configs:
      - targets: ['host.docker.internal:5004']
        labels:
          service: 'financial'
    metrics_path: '/metrics'

  # Dashboard Service
  - job_name: 'dashboard'
    static_configs:
      - targets: ['host.docker.internal:5005']
        labels:
          service: 'dashboard'
    metrics_path: '/metrics'
        action: keep
        regex: .+
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: admin-http
      - source_labels: [__meta_kubernetes_pod_label_linkerd_io_control_plane_component]
        action: replace
        target_label: component

  # Kafka JMX Exporter
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-jmx-exporter:7071']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "alert_rules.yml"
