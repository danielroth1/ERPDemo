# =============================================================================
# Azure Key Vault Secret Provider
# =============================================================================
# Uses the Azure Key Vault Secrets Provider add-on (enabled on AKS during
# aks-provision.sh). Secrets in Key Vault are synced into K8s Secrets via the
# CSI driver whenever the secret-sync pod is running.
#
# Secrets managed here:
#   grafana-admin-secret  ← synced from KV: grafana-admin-user / grafana-admin-password
#
# Secrets managed imperatively by aks-deploy.sh (not here, to avoid conflict
# with the base postgres-secret definition):
#   postgres-secret       ← created by aks-deploy.sh after kustomize apply
#
# Placeholders (AZURE_KV_IDENTITY_CLIENT_ID, AZURE_KEYVAULT_NAME, AZURE_TENANT_ID)
# are replaced by aks-deploy.sh at deploy time via a temporary kustomize overlay.
#
# Key Vault must contain these secrets (created by aks-provision.sh):
#   grafana-admin-user
#   grafana-admin-password
#   pg-connection-string-users
#   pg-connection-string-inventory
#   pg-connection-string-sales
#   pg-connection-string-financial
#   pg-connection-string-dashboard
#   pg-connection-string-orchestration
# =============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-erp
  namespace: erp-azure
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "AZURE_KV_IDENTITY_CLIENT_ID"    # replaced by aks-deploy.sh
    keyvaultName: "AZURE_KEYVAULT_NAME"         # replaced by aks-deploy.sh
    tenantId: "AZURE_TENANT_ID"                 # replaced by aks-deploy.sh
    objects: |
      array:
        - |
          objectName: grafana-admin-user
          objectType: secret
        - |
          objectName: grafana-admin-password
          objectType: secret
  # secretObjects: creates K8s Secrets from the Key Vault values.
  # grafana-admin-secret is NOT defined in base/, so there is no conflict.
  secretObjects:
    - secretName: grafana-admin-secret
      type: Opaque
      data:
        - objectName: grafana-admin-user
          key: admin-user
        - objectName: grafana-admin-password
          key: admin-password
---
# secret-sync: a minimal always-running pod whose only purpose is to keep the
# CSI volume mounted so the Key Vault → K8s Secret sync runs continuously.
# Without this pod the secrets are only synced while ERP service pods are
# running, which creates a bootstrap chicken-and-egg problem on first deploy.
#
# Uses registry.k8s.io/pause (< 1 MB, no security surface).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-sync
  namespace: erp-azure
  labels:
    app: secret-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-sync
  template:
    metadata:
      labels:
        app: secret-sync
    spec:
      containers:
        - name: secret-sync
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              memory: "4Mi"
              cpu: "1m"
            limits:
              memory: "8Mi"
              cpu: "10m"
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: azure-keyvault-erp
