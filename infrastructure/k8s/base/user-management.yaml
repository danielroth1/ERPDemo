apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management
  namespace: erp-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-management
  template:
    metadata:
      labels:
        app: user-management
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo "Waiting for postgres..."; sleep 3; done']
      - name: wait-for-kafka
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z kafka-service 9092; do echo "Waiting for kafka..."; sleep 3; done']
      containers:
      - name: user-management
        image: erp/user-management
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: PostgreSQL__ConnectionString
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: connection-string-users
        - name: Kafka__BootstrapServers
          value: "kafka-service:9092"
        - name: Jwt__Secret
          value: "your-secret-key-change-in-production-min-32-chars"
        - name: Jwt__Issuer
          value: "erp-system"
        - name: Jwt__Audience
          value: "erp-client"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-management-service
  namespace: erp-local
spec:
  selector:
    app: user-management
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
