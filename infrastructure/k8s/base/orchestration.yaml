apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestration
  namespace: erp-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestration
  template:
    metadata:
      labels:
        app: orchestration
    spec:
      containers:
      - name: orchestration
        image: erp/orchestration
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://tempo-service:4317"
        - name: OTEL_SERVICE_NAME
          value: "orchestration"
        - name: ConnectionStrings__erp-orchestration
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: connection-string-orchestration
        - name: Kafka__BootstrapServers
          value: "kafka-service:9092"
        - name: RabbitMQ__Host
          value: "rabbitmq-service"
        - name: RabbitMQ__Username
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: username
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: password
        - name: Jwt__Secret
          value: "your-secret-key-change-in-production-min-32-chars"
        - name: Jwt__Issuer
          value: "erp-system"
        - name: Jwt__Audience
          value: "erp-client"
        livenessProbe:
          httpGet:
            path: /alive
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: orchestration-service
  namespace: erp-local
spec:
  selector:
    app: orchestration
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
