apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: erp-local
data:
  init.sh: |
    #!/bin/bash
    set -e
    
    # Create multiple databases
    for db in erp_users erp_inventory erp_sales erp_financial erp_dashboard; do
      echo "Creating database: $db"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE DATABASE $db;
        GRANT ALL PRIVILEGES ON DATABASE $db TO $POSTGRES_USER;
    EOSQL
    done
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: erp-local
type: Opaque
stringData:
  username: postgres
  password: postgres
  connection-string-users: "Host=postgres-service;Port=5432;Database=erp_users;Username=postgres;Password=postgres"
  connection-string-inventory: "Host=postgres-service;Port=5432;Database=erp_inventory;Username=postgres;Password=postgres"
  connection-string-sales: "Host=postgres-service;Port=5432;Database=erp_sales;Username=postgres;Password=postgres"
  connection-string-financial: "Host=postgres-service;Port=5432;Database=erp_financial;Username=postgres;Password=postgres"
  connection-string-dashboard: "Host=postgres-service;Port=5432;Database=erp_dashboard;Username=postgres;Password=postgres"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: erp-local
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: POSTGRES_DB
          value: "postgres"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: postgres-init
        configMap:
          name: postgres-init
          defaultMode: 0755
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: erp-local
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None
