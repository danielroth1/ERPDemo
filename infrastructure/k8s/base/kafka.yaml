apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: erp-local
data:
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-service:9092"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
  # For single-node KRaft, avoid depending on the Service endpoints during startup.
  # Using the Service name here can deadlock because Endpoints are only published after readiness.
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_LOG_RETENTION_HOURS: "24"
  KAFKA_LOG_SEGMENT_BYTES: "104857600"
  CLUSTER_ID: "SIOelZD3O06P-hX-XIPBVg"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
  namespace: erp-local
  annotations:
    # Re-run this job when the ConfigMap changes (e.g. new topics added)
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-kafka
        image: confluentinc/cp-kafka:7.5.0
        command:
        - /bin/bash
        - -c
        - |
          echo "Waiting for Kafka to be ready..."
          until kafka-topics --bootstrap-server kafka-service:9092 --list > /dev/null 2>&1; do
            echo "  Kafka not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "Kafka is ready."
      containers:
      - name: create-topics
        image: confluentinc/cp-kafka:7.5.0
        command:
        - /bin/bash
        - -c
        - |
          BOOTSTRAP=kafka-service:9092
          TOPICS="
            submit-purchase
            submit-return
            reserve-stock
            deduct-stock
            restore-stock
            create-purchase-transaction
            create-refund-transaction
            stock-reserved
            stock-reservation-failed
            stock-deducted
            stock-deduction-failed
            purchase-transaction-created
            purchase-transaction-failed
            stock-restored
            refund-transaction-created
            refund-transaction-failed
            purchase-completed
            purchase-failed
            return-completed
            return-failed
            product-created
            product-updated
            product-deleted
            stock-updated
            low-stock-alert
            stock-movement-created
            user-created
            user-updated
            user-deleted
            user-deactivated
            order-created
            order-status-changed
            invoice-created
            invoice-paid
            transaction-created
            budget-exceeded
          "
          for topic in $TOPICS; do
            kafka-topics --bootstrap-server $BOOTSTRAP \
              --create --if-not-exists \
              --topic "$topic" \
              --partitions 1 \
              --replication-factor 1
            echo "  ✓ $topic"
          done
          echo "All topics ready."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: erp-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.5.0
        ports:
        - containerPort: 9092
          name: kafka
        - containerPort: 9093
          name: controller
        envFrom:
        - configMapRef:
            name: kafka-config
        env:
        - name: KAFKA_LOG_DIRS
          value: /var/lib/kafka/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 60
          timeoutSeconds: 2
          periodSeconds: 10
          failureThreshold: 6
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          timeoutSeconds: 2
          periodSeconds: 5
          failureThreshold: 12
      volumes:
      - name: kafka-data
        persistentVolumeClaim:
          claimName: kafka-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data-pvc
  namespace: erp-local
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: erp-local
spec:
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092
    name: kafka
  - port: 9093
    targetPort: 9093
    name: controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: erp-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
      - name: kafka-ui
        image: provectuslabs/kafka-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: KAFKA_CLUSTERS_0_NAME
          value: "local"
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: "kafka-service:9092"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui-service
  namespace: erp-local
spec:
  selector:
    app: kafka-ui
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
