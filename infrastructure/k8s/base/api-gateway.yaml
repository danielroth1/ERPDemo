apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: erp-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: erp/gateway
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: Jwt__Secret
          value: "your-secret-key-change-in-production-min-32-chars"
        - name: Jwt__Issuer
          value: "erp-system"
        - name: Jwt__Audience
          value: "erp-client"
        # YARP destination addresses (override appsettings.json placeholders)
        - name: ReverseProxy__Clusters__user-cluster__Destinations__destination1__Address
          value: "http://user-management-service:8080"
        - name: ReverseProxy__Clusters__inventory-cluster__Destinations__destination1__Address
          value: "http://inventory-service:8080"
        - name: ReverseProxy__Clusters__sales-cluster__Destinations__destination1__Address
          value: "http://sales-service:8080"
        - name: ReverseProxy__Clusters__financial-cluster__Destinations__destination1__Address
          value: "http://financial-service:8080"
        - name: ReverseProxy__Clusters__dashboard-cluster__Destinations__destination1__Address
          value: "http://dashboard-service:8080"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: erp-local
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
