apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: erp-system

# Build configuration for all services
build:
  artifacts:
    # Backend services
    - image: erp/user-management
      context: services/user-management
      custom:
        buildCommand: powershell -NoProfile -ExecutionPolicy Bypass -File tools/skaffold-build.ps1 -Context services/user-management -Dockerfile services/user-management/Dockerfile
        dependencies:
          paths:
            - "**/*"
      sync:
        manual:
          - src: "**/*.cs"
            dest: /app
    
    - image: erp/inventory
      context: services/inventory
      custom:
        buildCommand: powershell -NoProfile -ExecutionPolicy Bypass -File tools/skaffold-build.ps1 -Context services/inventory -Dockerfile services/inventory/Dockerfile
        dependencies:
          paths:
            - "**/*"
      sync:
        manual:
          - src: "**/*.cs"
            dest: /app
    
    - image: erp/sales
      context: services/sales
      custom:
        buildCommand: powershell -NoProfile -ExecutionPolicy Bypass -File tools/skaffold-build.ps1 -Context services/sales -Dockerfile services/sales/Dockerfile
        dependencies:
          paths:
            - "**/*"
      sync:
        manual:
          - src: "**/*.cs"
            dest: /app
    
    - image: erp/financial
      context: services/financial
      custom:
        buildCommand: powershell -NoProfile -ExecutionPolicy Bypass -File tools/skaffold-build.ps1 -Context services/financial -Dockerfile services/financial/Dockerfile
        dependencies:
          paths:
            - "**/*"
      sync:
        manual:
          - src: "**/*.cs"
            dest: /app
    
    - image: erp/dashboard
      context: services/dashboard
      custom:
        buildCommand: powershell -NoProfile -ExecutionPolicy Bypass -File tools/skaffold-build.ps1 -Context services/dashboard -Dockerfile services/dashboard/Dockerfile
        dependencies:
          paths:
            - "**/*"
      sync:
        manual:
          - src: "**/*.cs"
            dest: /app
    
    - image: erp/gateway
      context: services/gateway
      custom:
        buildCommand: powershell -NoProfile -ExecutionPolicy Bypass -File tools/skaffold-build.ps1 -Context services/gateway -Dockerfile services/gateway/Dockerfile
        dependencies:
          paths:
            - "**/*"
      sync:
        manual:
          - src: "**/*.cs"
            dest: /app
    
    # Frontend
    - image: erp/frontend
      context: frontend
      custom:
        buildCommand: powershell -NoProfile -ExecutionPolicy Bypass -File tools/skaffold-build.ps1 -Context frontend -Dockerfile frontend/Dockerfile
        dependencies:
          paths:
            - Dockerfile
            - nginx.conf
            - index.html
            - package.json
            - package-lock.json
            - vite.config.*
            - tsconfig*.json
            - public/**
            - src/**
      sync:
        manual:
          - src: "src/**/*"
            dest: /app/src
  
  tagPolicy:
    gitCommit: {}

  local:
    push: false
    tryImportMissing: false
    useDockerCLI: true

manifests:
  kustomize:
    paths:
      - infrastructure/k8s/local

# Deploy configuration
deploy:
  kubectl: {}

# Port forwarding for local access
portForward:
  - resourceType: service
    resourceName: frontend-service
    port: 80
    localPort: 3000
  
  - resourceType: service
    resourceName: gateway-service
    port: 80
    localPort: 8080
  
  - resourceType: service
    resourceName: grafana-service
    port: 3000
    localPort: 3001

# Profiles for different environments
profiles:
  # Local development profile (default)
  - name: local
    activation:
      - command: dev

  # Testing profile for CI/CD
  - name: testing

  # Production profile
  - name: production
