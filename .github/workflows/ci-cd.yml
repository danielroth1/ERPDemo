name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io/danielroth1
  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  test-backend:
    name: Test Backend Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: user-management
            test-project: services/user-management/UserManagement.Tests/UserManagement.Tests.csproj
          - service: inventory
            test-project: services/inventory/InventoryManagement.Tests/InventoryManagement.Tests.csproj
          - service: sales
            test-project: services/sales/SalesManagement.Tests/SalesManagement.Tests.csproj
          - service: financial
            test-project: services/financial/FinancialManagement.Tests/FinancialManagement.Tests.csproj
          - service: dashboard
            test-project: services/dashboard/DashboardAnalytics.Tests/DashboardAnalytics.Tests.csproj
          - service: orchestration
            test-project: services/orchestration/Orchestration.Tests/Orchestration.Tests.csproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Generate Kiota clients (inventory)
        if: matrix.service == 'inventory'
        run: |
          dotnet kiota generate --language CSharp \
            --openapi docs/openapi/financial.json \
            --output services/inventory/InventoryManagement/Generated/Clients/Financial \
            --class-name FinancialServiceClient \
            --namespace-name InventoryManagement.Generated.Clients.Financial \
            --backing-store --additional-data --clean-output

      - name: Generate Kiota clients (sales)
        if: matrix.service == 'sales'
        run: |
          dotnet kiota generate --language CSharp \
            --openapi docs/openapi/financial.json \
            --output services/sales/SalesManagement/Generated/Clients/Financial \
            --class-name FinancialServiceClient \
            --namespace-name SalesManagement.Generated.Clients.Financial \
            --backing-store --additional-data --clean-output
          dotnet kiota generate --language CSharp \
            --openapi docs/openapi/inventory.json \
            --output services/sales/SalesManagement/Generated/Clients/Inventory \
            --class-name InventoryServiceClient \
            --namespace-name SalesManagement.Generated.Clients.Inventory \
            --backing-store --additional-data --clean-output

      - name: Generate Kiota clients (dashboard)
        if: matrix.service == 'dashboard'
        run: |
          dotnet kiota generate --language CSharp \
            --openapi docs/openapi/user-management.json \
            --output services/dashboard/DashboardAnalytics/Generated/Clients/UserManagement \
            --class-name UserManagementServiceClient \
            --namespace-name DashboardAnalytics.Generated.Clients.UserManagement \
            --backing-store --additional-data --clean-output
          dotnet kiota generate --language CSharp \
            --openapi docs/openapi/sales.json \
            --output services/dashboard/DashboardAnalytics/Generated/Clients/Sales \
            --class-name SalesServiceClient \
            --namespace-name DashboardAnalytics.Generated.Clients.Sales \
            --backing-store --additional-data --clean-output
          dotnet kiota generate --language CSharp \
            --openapi docs/openapi/financial.json \
            --output services/dashboard/DashboardAnalytics/Generated/Clients/Financial \
            --class-name FinancialServiceClient \
            --namespace-name DashboardAnalytics.Generated.Clients.Financial \
            --backing-store --additional-data --clean-output
          dotnet kiota generate --language CSharp \
            --openapi docs/openapi/inventory.json \
            --output services/dashboard/DashboardAnalytics/Generated/Clients/Inventory \
            --class-name InventoryServiceClient \
            --namespace-name DashboardAnalytics.Generated.Clients.Inventory \
            --backing-store --additional-data --clean-output

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.test-project }}

      - name: Build
        run: dotnet build ${{ matrix.test-project }} --configuration Release

      - name: Run unit tests
        run: dotnet test ${{ matrix.test-project }} --verbosity normal --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage/**/coverage.cobertura.xml
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage
          fail_ci_if_error: false

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: ./frontend
        run: npm test -- --coverage

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  test-e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write KinD config
        run: |
          cat > /tmp/kind-config.yaml << 'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            kubeadmConfigPatches:
            - |
              kind: InitConfiguration
              nodeRegistration:
                kubeletExtraArgs:
                  node-labels: "ingress-ready=true"
            extraPortMappings:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
            - containerPort: 443
              hostPort: 443
              protocol: TCP
          EOF

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: erp-test
          config: /tmp/kind-config.yaml

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Generate Kiota clients (inventory)
        run: |
          dotnet kiota generate --language CSharp \
            --openapi docs/openapi/financial.json \
            --output services/inventory/InventoryManagement/Generated/Clients/Financial \
            --class-name FinancialServiceClient \
            --namespace-name InventoryManagement.Generated.Clients.Financial \
            --backing-store --additional-data --clean-output

      - name: Generate Kiota clients (sales)
        run: |
          dotnet kiota generate --language CSharp \
            --openapi docs/openapi/financial.json \
            --output services/sales/SalesManagement/Generated/Clients/Financial \
            --class-name FinancialServiceClient \
            --namespace-name SalesManagement.Generated.Clients.Financial \
            --backing-store --additional-data --clean-output
          dotnet kiota generate --language CSharp \
            --openapi docs/openapi/inventory.json \
            --output services/sales/SalesManagement/Generated/Clients/Inventory \
            --class-name InventoryServiceClient \
            --namespace-name SalesManagement.Generated.Clients.Inventory \
            --backing-store --additional-data --clean-output

      - name: Generate Kiota clients (dashboard)
        run: |
          dotnet kiota generate --language CSharp \
            --openapi docs/openapi/user-management.json \
            --output services/dashboard/DashboardAnalytics/Generated/Clients/UserManagement \
            --class-name UserManagementServiceClient \
            --namespace-name DashboardAnalytics.Generated.Clients.UserManagement \
            --backing-store --additional-data --clean-output
          dotnet kiota generate --language CSharp \
            --openapi docs/openapi/sales.json \
            --output services/dashboard/DashboardAnalytics/Generated/Clients/Sales \
            --class-name SalesServiceClient \
            --namespace-name DashboardAnalytics.Generated.Clients.Sales \
            --backing-store --additional-data --clean-output
          dotnet kiota generate --language CSharp \
            --openapi docs/openapi/financial.json \
            --output services/dashboard/DashboardAnalytics/Generated/Clients/Financial \
            --class-name FinancialServiceClient \
            --namespace-name DashboardAnalytics.Generated.Clients.Financial \
            --backing-store --additional-data --clean-output

      - name: Load Docker images
        run: |
          docker build -t erp-user-management:test -f ./services/user-management/Dockerfile ./services
          docker build -t erp-inventory:test -f ./services/inventory/Dockerfile ./services
          docker build -t erp-sales:test -f ./services/sales/Dockerfile ./services
          docker build -t erp-financial:test -f ./services/financial/Dockerfile ./services
          docker build -t erp-dashboard:test -f ./services/dashboard/Dockerfile ./services
          docker build -t erp-gateway:test -f ./services/gateway/Dockerfile ./services
          docker build -t erp-frontend:test ./frontend
          
          kind load docker-image erp-user-management:test --name erp-test
          kind load docker-image erp-inventory:test --name erp-test
          kind load docker-image erp-sales:test --name erp-test
          kind load docker-image erp-financial:test --name erp-test
          kind load docker-image erp-dashboard:test --name erp-test
          kind load docker-image erp-gateway:test --name erp-test
          kind load docker-image erp-frontend:test --name erp-test

      - name: Deploy to KinD
        run: |
          kubectl create namespace erp-test
          kubectl apply -k infrastructure/k8s/test/
          # Wait for infrastructure dependencies first
          kubectl rollout status deployment/kafka -n erp-test --timeout=300s
          kubectl rollout status statefulset/postgres -n erp-test --timeout=120s
          kubectl rollout status deployment/rabbitmq -n erp-test --timeout=120s
          # Wait for kafka topics job to complete (Jobs use condition=complete, not ready)
          kubectl wait --for=condition=complete job/kafka-init-topics -n erp-test --timeout=120s
          # Wait for application services
          kubectl rollout status deployment/gateway -n erp-test --timeout=300s
          kubectl rollout status deployment/user-management -n erp-test --timeout=300s
          kubectl rollout status deployment/inventory -n erp-test --timeout=300s
          kubectl rollout status deployment/sales -n erp-test --timeout=300s
          kubectl rollout status deployment/financial -n erp-test --timeout=300s
          kubectl rollout status deployment/dashboard -n erp-test --timeout=300s
          kubectl rollout status deployment/frontend -n erp-test --timeout=180s

      - name: Debug failed deployments
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n erp-test -o wide || true
          echo "=== Events ==="
          kubectl get events -n erp-test --sort-by='.lastTimestamp' | tail -40 || true
          for svc in financial inventory sales user-management dashboard gateway; do
            echo "=== ${svc} Pod Description ==="
            kubectl describe pod -l app=${svc} -n erp-test || true
            echo "=== ${svc} Logs (previous container) ==="
            kubectl logs -l app=${svc} -n erp-test --previous --tail=50 || true
            echo "=== ${svc} Logs (current container) ==="
            kubectl logs -l app=${svc} -n erp-test --tail=50 || true
          done

      - name: Install Playwright
        working-directory: ./tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run E2E tests
        working-directory: ./tests/e2e
        run: npx playwright test
        env:
          BASE_URL: http://localhost

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 30

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    strategy:
      matrix:
        service:
          - user-management
          - inventory
          - sales
          - financial
          - dashboard
          - gateway
          - orchestration
          - frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: env.GHCR_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Extract metadata
        if: env.GHCR_TOKEN != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/erp-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: env.GHCR_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'frontend' && './frontend' || './services' }}
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/erp-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/erp-${{ matrix.service }}:buildcache,mode=max

      - name: Run Trivy vulnerability scanner
        if: env.GHCR_TOKEN != '' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/erp-${{ matrix.service }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        if: env.GHCR_TOKEN != '' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, test-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://shopping-now.net
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=()
          [ -z "$SSH_PRIVATE_KEY" ] && missing+=("SSH_PRIVATE_KEY")
          [ -z "$SSH_HOST" ]        && missing+=("SSH_HOST")
          [ -z "$SSH_USER" ]        && missing+=("SSH_USER")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ Missing required secrets: ${missing[*]}"
            echo "   Set these in GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 7878 -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Fetch kubeconfig from server
        run: |
          mkdir -p ~/.kube
          scp -P 7878 "$SSH_USER@$SSH_HOST:~/.kube/k3s-erp.yaml" ~/.kube/config

      - name: Ensure namespace exists
        run: |
          kubectl create namespace erp-prod --dry-run=client -o yaml | kubectl apply -f -

      - name: Create GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=danielroth1 \
            --docker-password="$GHCR_TOKEN" \
            --namespace=erp-prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update MongoDB secret
        if: env.MONGODB_PASSWORD != ''
        run: |
          kubectl create secret generic mongodb-secret \
            --from-literal=username=admin \
            --from-literal=password="$MONGODB_PASSWORD" \
            --from-literal=connection-string="mongodb://admin:$MONGODB_PASSWORD@mongodb-service:27017" \
            --namespace=erp-prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update JWT secret
        if: env.JWT_SECRET != ''
        run: |
          kubectl create secret generic jwt-secret \
            --from-literal=secret="$JWT_SECRET" \
            --from-literal=issuer=erp-system \
            --from-literal=audience=erp-clients \
            --namespace=erp-prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update SMTP secret
        if: env.SMTP_HOST != ''
        run: |
          kubectl create secret generic smtp-secret \
            --from-literal=host="$SMTP_HOST" \
            --from-literal=port="$SMTP_PORT" \
            --from-literal=username="$SMTP_USERNAME" \
            --from-literal=password="$SMTP_PASSWORD" \
            --from-literal=from-email=noreply@shopping-now.net \
            --namespace=erp-prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy services
        run: |
          TAG="main-${GITHUB_SHA:0:7}"
          for svc in gateway user-management inventory sales financial dashboard frontend; do
            kubectl set image deployment/$svc $svc=${{ env.REGISTRY }}/erp-$svc:$TAG -n erp-prod
          done

      - name: Wait for rollout
        run: |
          for svc in gateway user-management inventory sales financial dashboard frontend; do
            kubectl rollout status deployment/$svc -n erp-prod --timeout=5m
          done

      - name: Verify deployment
        run: |
          kubectl get pods -n erp-prod
          kubectl get ingress -n erp-prod

      - name: Run health checks
        run: |
          sleep 30
          curl -f https://shopping-now.net/health/ready || exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          for svc in gateway user-management inventory sales financial dashboard frontend; do
            kubectl rollout undo deployment/$svc -n erp-prod
          done

      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful to production"
          else
            echo "❌ Deployment failed, rolled back"
          fi
